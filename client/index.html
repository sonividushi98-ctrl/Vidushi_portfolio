:host{display:block;--bg:#e4e4e6;--card:#0b1430;--ink:#f4f6fb;--mute:#8d99b5;--line:#ffffff}
*,*::before,*::after{box-sizing:border-box}
.pg{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-weight:500}

/* ---------- scroll layout ---------- */
.sticky{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.left{position:relative;overflow:hidden;background:
  linear-gradient(180deg,#0b0f45 0%,#0a1a6a 12%,#0a3a88 28%,#00598f 45%,#0a79a4 60%,#3f98b8 70%,#8cc4d6 78%,#cdeaf1 86%,#eefafc 100%)}

.deck .card{grid-area:1/1;will-change:transform;box-shadow:0 20px 50px rgba(0,0,0,.3)}

/* ---------- project card (from projects.html) ---------- */
.card{background:var(--card);border:1px solid #ffffff14;border-radius:16px;padding:34px 30px 26px;margin:0;color:var(--ink)}
.card h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.stage{position:relative;height:clamp(340px,50vh,410px);margin:18px 0 24px}
.stage svg.w{position:absolute;inset:0;width:100%;height:100%}
.stage path{fill:none;stroke:var(--line);stroke-width:.75;vector-effect:non-scaling-stroke;opacity:.85}
.n{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:13px;background:#fff;color:#0b1430;display:flex;align-items:center;justify-content:center}
.n.hub{width:58px;height:58px;border-radius:16px;box-shadow:0 0 0 6px #ffffff22}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hub .ic{width:26px;height:26px}
.l{position:absolute;transform:translateX(-50%);font-size:12px;color:#dfe5f3;white-space:nowrap}
.d{font-size:15px;line-height:1.75;color:var(--mute);margin:0 0 22px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;padding:5px 12px;border-radius:999px;background:#fff;color:#0b1430;font-weight:500}
.tag.o{background:transparent;color:#c9d2e6;border:1px solid #ffffff33;font-weight:400}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:30px;padding-top:22px;border-top:1px solid #ffffff1f}
.live{display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;font-size:13px;font-weight:500;padding:6px 12px 6px 12px;border-radius:999px;border:1px solid #ffffff26}.live{padding:4px 4px 4px 12px}.live .ar{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}.live .ar .ic{width:14px;height:14px;stroke-width:2}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e88}
@media (prefers-reduced-motion:no-preference){.dot{animation:blink 1.4s ease-in-out infinite}}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 #22c55e88}50%{opacity:.25;box-shadow:0 0 0 5px #22c55e00}}
.gh{display:inline-flex;align-items:center;justify-content:center;background:none;text-decoration:none;border-radius:50%;padding:0}
.gh .mk{width:40px;height:40px;border-radius:50%;background:#000;color:#fff;border:1px solid #ffffff26;display:flex;align-items:center;justify-content:center}.gh .mk .ic{width:18px;height:18px;stroke-width:1.6}.gh:focus-visible{outline:2px solid #fff;outline-offset:4px}


/* card 2: ocean */
.card.ocean{background:linear-gradient(180deg,#02205c 0%,#03427a 55%,#0a79a6 100%);border-color:#ffffff22}
.card.ocean .stage{border:1px solid rgba(255,255,255,.22);border-radius:16px;background-image:radial-gradient(rgba(255,255,255,.28) 1px,transparent 1.3px);background-size:14px 14px}
.card.ocean .stage path{stroke:rgba(255,255,255,.6)}
.card.ocean .d{color:#bcd3e6}
/* card 3: paper */
.card.paper{background:#ebebeb;color:#000;border-color:#00000018}
.card.paper h2{color:#000}
.card.paper .d{color:#222}
.card.paper .stage path{stroke:#000;opacity:1}
.card.paper .n{background:#000;color:#fff}
.card.paper .n.hub{box-shadow:0 0 0 6px #00000022}
.card.paper .l{color:#000}

.card.paper .foot{border-top-color:#00000026}
.card.paper .gh .mk{background:#000;color:#fff;border:1px solid #ffffff26}
.card.paper .live .ar{background:#fff;color:#000;border:none}
.card.paper .gh:focus-visible{outline-color:#000}

@media (max-height:800px){.card{padding:24px 24px 20px}.card h2{font-size:24px}.d{font-size:14px;line-height:1.6;margin-bottom:16px}.foot{margin-top:20px;padding-top:16px}}

<template id="t-experience"><style>

header{max-width:1100px;margin:0 auto;padding:72px 24px 24px;color:#fff}

.item{--ox:-70px;--dy:44px}

<script>
(function(){var root=document.getElementById('hero').shadowRoot;

(async function () {
  const WORD   = 'VIDUSHI SONI';
  const FONT   = '"Manverse Normal","Manverse",Anton,Impact,"Arial Narrow",sans-serif';   // Anton = fallback
  const WEIGHT = 400;                 // Manverse "Normal"
  const SIZE   = 400;
  const TRACK  = SIZE * 0.01;         // letter spacing
  const DROP   = 0;                   // heading: no dropped letters (set e.g. 0.3 to drop word-final I's)
  const MONO   = '"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace';

  const hero   = root.getElementById('hero');
  const svg    = root.getElementById('title');
  const text   = root.getElementById('word');
  const extG   = root.getElementById('ext');
  const canvas = root.getElementById('code');
  const ctx    = canvas.getContext('2d');

  // Wait for the fonts, but never get stuck if Manverse_Normal.ttf isn't there (Anton is used then).
  await Promise.allSettled([
    document.fonts.load('400 200px "Manverse Normal"'),
    document.fonts.load('400 200px "Anton"'),
    document.fonts.load('700 20px "JetBrains Mono"')
  ]);
  try { await document.fonts.ready; } catch (e) {}

  /* ---------- Title geometry ---------- */
  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = WEIGHT + ' ' + SIZE + 'px ' + FONT;

  const chars = Array.from(WORD);
  const xs = [];
  let pen = 0, maxAsc = 0, inkLeft = 0, inkRight = 0, first = true;
  chars.forEach((ch, i) => {
    xs.push(pen);
    const mm = mctx.measureText(ch);
    if (ch !== ' ') {
      maxAsc = Math.max(maxAsc, mm.actualBoundingBoxAscent);
      if (first) { inkLeft = pen - mm.actualBoundingBoxLeft; first = false; }
      inkRight = pen + mm.actualBoundingBoxRight;
    }
    pen += mm.width + TRACK;
  });

  const mI   = mctx.measureText('I');
  const capH = mI.actualBoundingBoxAscent;
  const EXT  = capH * DROP;

  // The I at the end of each word extends downward, exactly like the poster.
  const drops = [];
  chars.forEach((ch, i) => {
    if (DROP > 0 && ch === 'I' && (i === chars.length - 1 || chars[i + 1] === ' ')) {
      drops.push({
        x: xs[i] - mI.actualBoundingBoxLeft,
        y: -2,
        w: mI.actualBoundingBoxLeft + mI.actualBoundingBoxRight,
        h: EXT + 2
      });
    }
  });

  const pad = 2;
  const vb = {
    x: inkLeft - pad,
    y: -maxAsc - pad,
    w: (inkRight - inkLeft) + pad * 2,
    h: maxAsc + EXT + pad * 2
  };

  text.setAttribute('font-size', SIZE);
  text.style.fontFamily = FONT;
  text.style.fontWeight = WEIGHT;
  text.setAttribute('x', xs.join(' '));
  text.textContent = WORD;

  drops.forEach(d => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('class', 'glyph');
    r.setAttribute('x', d.x); r.setAttribute('y', d.y);
    r.setAttribute('width', d.w); r.setAttribute('height', d.h);
    extG.appendChild(r);
  });
  svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
  // Heading box: always the full screen width. STRETCH > 1 elongates the letters vertically (taller, narrower look);
  // < 1 would make them wider and shorter.
  const STRETCH = 1.5;
  hero.style.aspectRatio = (vb.w / vb.h / STRETCH) + ' / 1';

  /* ---------- Hover code effect (small patch, fades in and out) ---------- */
  const TAU = Math.PI * 2;
  const CHARS = '2=t*+/2=t*+/012<>';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth  = v => { v = clamp01(v); return v * v * (3 - 2 * v); };

  const maskCv  = document.createElement('canvas');
  const maskCtx = maskCv.getContext('2d', { willReadFrequently: true });

  let W = 1, H = 1, dpr = 1, sx = 1, sy = 1;
  let cw = 10, chh = 14, fs = 12, R0 = 110;
  let cells = [];

  // Draws the exact letter shapes (glyphs + dropped I's) in the title's coordinate space.
  function drawShape(c, scaleX, scaleY, k) {
    c.setTransform(scaleX * k, 0, 0, scaleY * k, -vb.x * scaleX * k, -vb.y * scaleY * k);
    c.font = WEIGHT + ' ' + SIZE + 'px ' + FONT;
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    c.fillStyle = '#000';
    chars.forEach((ch, i) => { if (ch !== ' ') c.fillText(ch, xs[i], 0); });
    drops.forEach(d => c.fillRect(d.x, d.y, d.w, d.h));
    c.setTransform(1, 0, 0, 1, 0, 0);

  function layout() {
    const r = hero.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    sx = W / vb.w;
    sy = H / vb.h;

    maskCv.width = W; maskCv.height = H;
    maskCtx.clearRect(0, 0, W, H);
    drawShape(maskCtx, sx, sy, 1);
    const data = maskCtx.getImageData(0, 0, W, H).data;
    const inside = (x, y) => {
      x = x | 0; y = y | 0;
      if (x < 0 || y < 0 || x >= W || y >= H) return false;
      return data[(y * W + x) * 4 + 3] > 40;
    };

    const cell = Math.round(Math.min(12, Math.max(7, W / 120)));
    cw = cell * 0.75; chh = cell * 1.1; fs = cell * 0.95;
    R0 = Math.max(60, Math.min(110, W * 0.17));     // small area around the cursor

    cells = [];
    const cols = Math.ceil(W / cw), rows = Math.ceil(H / chh);
    for (let rr = 0; rr < rows; rr++) {
      for (let cc = 0; cc < cols; cc++) {
        const x = (cc + 0.5) * cw, y = (rr + 0.5) * chh;
        const ox = cw * 0.35, oy = chh * 0.35;
        if (inside(x, y) || inside(x - ox, y - oy) || inside(x + ox, y - oy) ||
            inside(x - ox, y + oy) || inside(x + ox, y + oy)) {
          cells.push({
            x, y,
            ph: Math.random() * TAU,
            sp: 0.9 + Math.random() * 1.4,
            seed: (Math.random() * 1000) | 0
          });
        }
      }
    }
  }

  const state = { hover: 0, target: 0, px: 0, py: 0, tx: 0, ty: 0, running: false };
  const BR_A = [125, 211, 252], BR_B = [236, 255, 200];

  function frame(ts) {
    const t = (ts / 1000) * (reduce ? 0.4 : 1);
    state.hover += (state.target - state.hover) * 0.09;
    state.px += (state.tx - state.px) * 0.18;
    state.py += (state.ty - state.py) * 0.18;

    if (state.target === 0 && state.hover < 0.004) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      state.running = false;
      return;
    }

    const h = state.hover, px = state.px, py = state.py;
    // The patch grows out of the cursor on enter and shrinks back into the exit point on leave.
    const R = R0 * (0.3 + 0.7 * smooth(h));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);

    // 1) deepen the letters inside the patch so the code reads clearly
    let g = ctx.createRadialGradient(px, py, 0, px, py, R * 1.2);
    g.addColorStop(0,   'rgba(2,6,18,' + (0.7 * h) + ')');
    g.addColorStop(0.6, 'rgba(2,8,24,' + (0.5 * h) + ')');
    g.addColorStop(1,   'rgba(2,8,24,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - R * 1.3, py - R * 1.3, R * 2.6, R * 2.6);

    // 2) soft glow at the core
    ctx.globalCompositeOperation = 'lighter';
    g = ctx.createRadialGradient(px, py, 0, px, py, R * 0.85);
    g.addColorStop(0,   'rgba(190,255,140,' + (0.26 * h) + ')');
    g.addColorStop(0.5, 'rgba(56,189,248,'  + (0.20 * h) + ')');
    g.addColorStop(1,   'rgba(56,189,248,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - R, py - R, R * 2, R * 2);
    ctx.globalCompositeOperation = 'source-over';

    // 3) code: fixed grid, each character fades out, swaps glyph, fades back in. Nothing moves.
    ctx.font = '700 ' + fs + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      const dx = c.x - px, dy = c.y - py;
      if (dx > R || dx < -R || dy > R || dy < -R) continue;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d >= R) continue;
      const near = smooth(1 - d / R);

      const phase = t * c.sp + c.ph;
      const cyc = Math.floor(phase / TAU);
      const s = 0.5 - 0.5 * Math.cos(phase);          // 0 → 1 → 0 each cycle
      const a = Math.pow(s, 1.3) * near * h;
      if (a < 0.02) continue;

      const n2 = Math.pow(near, 1.4);
      const r = BR_A[0] + (BR_B[0] - BR_A[0]) * n2;
      const gg = BR_A[1] + (BR_B[1] - BR_A[1]) * n2;
      const b = BR_A[2] + (BR_B[2] - BR_A[2]) * n2;

      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (b | 0) + ')';
      ctx.fillText(CHARS.charAt((c.seed + cyc * 5) % CHARS.length), c.x, c.y);
    }
    ctx.globalAlpha = 1;

    // 4) keep everything strictly inside the letter shapes
    ctx.globalCompositeOperation = 'destination-in';
    drawShape(ctx, sx, sy, dpr);
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  function start() {
    if (!state.running) {
      state.running = true;
      requestAnimationFrame(frame);
    }
  }

    const r = hero.getBoundingClientRect();
    state.tx = e.clientX - r.left;
    state.ty = e.clientY - r.top;

  hero.addEventListener('pointermove',  e => { setPos(e, false); });
  hero.addEventListener('pointerleave', () => { state.target = 0; start(); });   // position stays → fades out right where you left
  hero.addEventListener('pointercancel',() => { state.target = 0; start(); });
})();

})();

/* Tagline: each letter is a 3D cube that rolls up to show the next letter */
(async function () {
  const PHRASES = ['Software Engineer', 'MERN Stack Developer', 'Full Stack Developer'];
  const DUR   = 800;     // ms, one letter's roll
  const STAG  = 45;      // ms between neighbouring letters
  const HOLD  = 2200;    // ms each phrase stays
  const START = 1000;    // ms before the first phrase
  const SPACE = 0.75;
  const TIGHT = 0.84;   // trims the extra gap between letters    // word gap, relative to a normal space
  const EASE  = 'cubic-bezier(.6,0,.25,1)';
  const tag = root.getElementById('tag');
  if (!tag) return;

  try { await document.fonts.load('500 20px "Plus Jakarta Sans"'); } catch (e) {}

  const N = Math.max(...PHRASES.map(p => p.length));
  const fsz = parseFloat(getComputedStyle(tag).fontSize) || 24;
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0';
  tag.appendChild(probe);
  const cache = {};
  const W = ch => {
    if (!ch) return 0;
    if (!(ch in cache)) {
      probe.textContent = ch;
      cache[ch] = probe.getBoundingClientRect().width / fsz * (ch === ' ' ? SPACE : TIGHT);
    }
    return cache[ch];
  };

  const cells = [];
  for (let i = 0; i < N; i++) {
    const rc   = document.createElement('span'); rc.className = 'rc';
    const cube = document.createElement('span'); cube.className = 'cube';
    const c = document.createElement('span'); c.className = 'c';
    const n = document.createElement('span'); n.className = 'n';
    cube.append(c, n); rc.appendChild(cube); tag.appendChild(rc);
    cells.push({ rc, cube, c, n, ch: '' });
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cells.forEach((x, i) => {
      const ch = PHRASES[0][i] || '';
      x.rc.style.transition = 'none';
      x.c.textContent = ch; x.ch = ch; x.rc.style.width = W(ch) + 'em';
    });
    return;
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  function roll(phrase) {
    const jobs = [];
    cells.forEach((x, i) => {
      const ch = phrase[i] || '';
      if (ch === '' && x.ch === '') return;       // empty cell stays empty
      x.n.textContent = ch;
      x.rc.style.transitionDuration = DUR + 'ms';
      x.rc.style.transitionDelay = (i * STAG) + 'ms';
      x.rc.style.width = W(ch) + 'em';
      const opt = { duration: DUR, delay: i * STAG, easing: EASE, fill: 'forwards' };
      const a = x.cube.animate([
        { transform: 'translateZ(-.7em) rotateX(0deg)' },
        { transform: 'translateZ(-.7em) rotateX(90deg)' }
      ], opt);
      const b = x.c.animate([{ opacity: 1 }, { opacity: 1, offset: .35 }, { opacity: 0 }], opt);
      const d = x.n.animate([{ opacity: 0 }, { opacity: 1, offset: .35 }, { opacity: 1 }], opt);
      jobs.push(a.finished.then(() => {
        x.c.textContent = ch; x.ch = ch;
        a.cancel(); b.cancel(); d.cancel();
      }));
    });
    return Promise.all(jobs);
  }

  await wait(START);
  for (let i = 0; ; i = (i + 1) % PHRASES.length) {
    await roll(PHRASES[i]);
    await wait(HOLD);
  }
})();

})();
